name: Daily Data Update & Deploy

on:
  schedule:
    # 하루 한 번(08:00 UTC 예약)만 돌릴 경우 GitHub 스케줄러 큐잉 지연으로
    # 실제 실행이 21~23시 KST까지 밀려, 그 전까지는 대시보드에 "오늘" 데이터가
    # 전혀 기록되지 않는 문제가 있었다. 하루 중 여러 시각에 재시도하도록 늘리고,
    # 매 정각(0분)은 전 세계적으로 큐가 몰려 지연이 커지므로 분(minute)도
    # 정각을 피해 분산시킨다.
    - cron: '43 3 * * *'   # 12:43 KST 무렵 — 낮 동안 부분 데이터 갱신
    - cron: '17 8 * * *'   # 17:17 KST 무렵 — 기존 예약 시각 유지
    - cron: '38 11 * * *'  # 20:38 KST 무렵 — 최종 마감 데이터 확보(위 두 번의 실행이 지연/실패해도 보완)
  workflow_dispatch:         # 수동 실행

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # past_data xlsx 커밋용

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python + Playwright ──────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 스크래핑 ─────────────────────────────────────────────────────
      - name: Download current month xlsx
        env:
          HES_USERNAME: ${{ secrets.HES_USERNAME }}
          HES_PASSWORD: ${{ secrets.HES_PASSWORD }}
        run: python scripts/daily_update.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/debug_*.png
          if-no-files-found: ignore

      # ── xlsx 변경분 커밋 (없으면 스킵) ────────────────────────────────
      - name: Commit updated xlsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add past_data/
          if git diff --cached --quiet; then
            echo "No xlsx changes — skipping commit."
          else
            git commit -m "data: update solar data $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi

      # ── data.json 생성 ────────────────────────────────────────────────
      - name: Build data.json from xlsx
        run: python scripts/build_data.py

      # ── React 빌드 ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix dashboard/frontend ci

      - name: Build React app
        run: npm --prefix dashboard/frontend run build

      # ── Firebase 배포 ─────────────────────────────────────────────────
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export PATH="$PWD/dashboard/frontend/node_modules/.bin:$PATH"
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
