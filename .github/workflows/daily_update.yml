name: Daily Data Update & Deploy

on:
  schedule:
    - cron: '0 10 * * *'   # 매일 19:00 KST (UTC+9 → 10:00 UTC)
  workflow_dispatch:         # 수동 실행

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # past_data xlsx 커밋용

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python + Playwright ──────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # ── 스크래핑 ─────────────────────────────────────────────────────
      - name: Download current month xlsx
        env:
          HES_USERNAME: ${{ secrets.HES_USERNAME }}
          HES_PASSWORD: ${{ secrets.HES_PASSWORD }}
        run: python scripts/daily_update.py

      # ── xlsx 변경분 커밋 (없으면 스킵) ────────────────────────────────
      - name: Commit updated xlsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add past_data/
          if git diff --cached --quiet; then
            echo "No xlsx changes — skipping commit."
          else
            git commit -m "data: update solar data $(date -u '+%Y-%m-%d') [skip ci]"
            git push
          fi

      # ── data.json 생성 ────────────────────────────────────────────────
      - name: Build data.json from xlsx
        run: python scripts/build_data.py

      # ── React 빌드 ────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix dashboard/frontend ci

      - name: Build React app
        run: npm --prefix dashboard/frontend run build

      # ── Firebase 배포 ─────────────────────────────────────────────────
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: solar-monitoring-eb12a
