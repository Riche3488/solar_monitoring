name: Solar Monitor

on:
  schedule:
    # KST 6:00~19:00 매 정각 실행 (UTC 기준)
    # KST = UTC+9 이므로: 6KST=21UTC, 19KST=10UTC
    - cron: '0 21-23,0-10 * * *'
  workflow_dispatch:  # 수동 실행 (테스트용)

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 모니터링 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HES_USERNAME: ${{ secrets.HES_USERNAME }}
          HES_PASSWORD: ${{ secrets.HES_PASSWORD }}
        run: python main.py

      - name: 당월 데이터 다운로드
        env:
          HES_USERNAME: ${{ secrets.HES_USERNAME }}
          HES_PASSWORD: ${{ secrets.HES_PASSWORD }}
        run: python get_past_data.py --current-month

      - name: 변경 데이터 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add past_data/
          git diff --staged --quiet || git commit -m "data: update current month excel [skip ci]"
          git push

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: 프론트엔드 의존성 설치
        run: npm --prefix dashboard/frontend ci

      - name: 대시보드 배포 (data.json 빌드 + Firebase)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          export PATH="$PWD/dashboard/frontend/node_modules/.bin:$PATH"
          firebase deploy --only hosting --token "$FIREBASE_TOKEN" --non-interactive
